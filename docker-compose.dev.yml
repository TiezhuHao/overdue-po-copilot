services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overdue_po_copilot}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-overdue_po_copilot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - system_a_postgres_data:/var/lib/postgresql/data

volumes:
  system_a_postgres_data:
