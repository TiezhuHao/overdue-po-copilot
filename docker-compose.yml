services:
  postgres:
    image: postgres:16
    container_name: overdue-po-copilot-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-overdue_po_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: overdue-po-copilot-backend
    environment:
      APP_ENV: ${APP_ENV:-local}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: overdue-po-copilot-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
